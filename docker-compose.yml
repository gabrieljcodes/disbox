version: '3.8'

services:
  disbox:
    build: .
    container_name: disbox
    restart: unless-stopped
    ports:
      - "8080:8080" # Map to the PROXY_PORT defined in your .env
    volumes:
      - ./data:/app/data
    working_dir: /app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://disbox:disbox_pass@postgres:5432/disbox?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/disbox"]

  postgres:
    image: postgres:15-alpine
    container_name: disbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: disbox
      POSTGRES_PASSWORD: disbox_pass
      POSTGRES_DB: disbox
    volumes:
      - disbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disbox -d disbox"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  disbox_pgdata:
