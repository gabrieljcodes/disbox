services:
  disbox:
    build: .
    container_name: disbox
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:${PROXY_PORT:-8080}"
    volumes:
      - ./data:/app/data
    working_dir: /app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://disbox:disbox_pass@postgres:5432/disbox?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/disbox"]

  postgres:
    image: postgres:15-alpine
    container_name: disbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: disbox
      POSTGRES_PASSWORD: disbox_pass
      POSTGRES_DB: disbox
    volumes:
      - disbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disbox -d disbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: disbox_flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - PORT=8191
      - CAPTCHA_SOLVER=none
    ports:
      - "8191:8191"

volumes:
  disbox_pgdata:
