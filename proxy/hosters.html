<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 Supported Hosters | Disbox</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="description" content="View supported hosters and limits on Disbox">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0a0f0d;
            --bg-secondary: #0f1a15;
            --bg-card: rgba(16, 30, 24, 0.8);
            --bg-card-hover: rgba(22, 42, 32, 0.9);
            --bg-input: rgba(12, 24, 18, 0.9);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-accent: rgba(30, 191, 106, 0.3);
            --text-primary: #e8f0ec;
            --text-secondary: #8ba396;
            --text-muted: #5a7264;
            --accent-indigo: #5ECBA5;
            --accent-emerald: #34d399;
            --accent-rose: #fb7185;
            --accent-blue: #60a5fa;
            --accent-amber: #fbbf24;
            --gradient-primary: linear-gradient(135deg, #1EBF6A 0%, #5ECBA5 100%);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 30px rgba(30, 191, 106, 0.15);
            --radius: 12px;
            --radius-lg: 16px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px; left: 50%; transform: translateX(-50%);
            width: 800px; height: 600px;
            background: radial-gradient(ellipse, rgba(30,191,106,0.08) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        /* ─── Topbar ─── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(10, 11, 15, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .topbar-brand {
            font-size: 18px;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            padding: 6px 12px;
            border-radius: var(--radius);
            background: var(--bg-glass);
            border: 1px solid var(--border-subtle);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        /* ─── Container ─── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
            position: relative;
            z-index: 1;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* ─── Search ─── */
        .search-container {
            max-width: 600px;
            margin: 0 auto 40px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 48px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            transition: var(--transition);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent-indigo);
            box-shadow: 0 0 0 3px rgba(94, 203, 165, 0.1);
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 20px;
            height: 20px;
        }

        /* ─── Grid ─── */
        .hosters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* ─── Cards ─── */
        .hoster-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
        }

        .hoster-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-accent);
            box-shadow: var(--shadow-glow);
        }
        
        .hoster-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--border-subtle);
            transition: var(--transition);
        }
        
        .hoster-card.online::before { background: var(--accent-emerald); }
        .hoster-card.offline::before { background: var(--accent-rose); }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .hoster-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: var(--bg-secondary);
            object-fit: cover;
            border: 1px solid var(--border-subtle);
            padding: 4px;
        }
        
        .hoster-info {
            flex: 1;
        }
        
        .hoster-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 50px;
            background: var(--bg-glass);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .status-online .status-dot { background: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
        .status-online { color: var(--accent-emerald); border: 1px solid rgba(52, 211, 153, 0.2); }
        
        .status-offline .status-dot { background: var(--accent-rose); box-shadow: 0 0 8px var(--accent-rose); }
        .status-offline { color: var(--accent-rose); border: 1px solid rgba(251, 113, 133, 0.2); }

        .domains-list {
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .domain-tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
        }

        /* ─── Progress Limits ─── */
        .limit-section {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .limit-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .limit-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        .limit-value {
            color: var(--text-primary);
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-input);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .unlimited-fill {
            background: var(--accent-blue);
            width: 100%;
        }
        
        .note-box {
            margin-top: 12px;
            padding: 10px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 8px;
            font-size: 12px;
            color: var(--accent-amber);
            line-height: 1.4;
        }
        
        /* ─── Loaders & States ─── */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            grid-column: 1 / -1;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(94, 203, 165, 0.1);
            border-top-color: var(--accent-indigo);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/dashboard" class="topbar-left">
            <svg class="back-btn" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="margin-right: 8px;">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <img src="/icon.png" width="28" height="28" style="vertical-align: middle;">
            <div class="topbar-brand">Disbox</div>
        </a>
    </div>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Supported Hosters</h1>
            <p class="page-subtitle">A dynamic list of hosters currently supported via our integrated TorBox accounts.</p>
        </div>

        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search by name or domain... (e.g. rapidgator)">
        </div>

        <div id="hostersGrid" class="hosters-grid">
            <div class="loader"><div class="spinner"></div></div>
        </div>
    </div>

    <script>
        let allHosters = [];

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function loadHosters() {
            try {
                const res = await fetch('/api/hosters');
                if (res.status === 401) {
                    window.location.href = '/dashboard';
                    return;
                }
                const data = await res.json();
                if (data.success) {
                    allHosters = data.data || [];
                    renderHosters(allHosters);
                } else {
                    document.getElementById('hostersGrid').innerHTML = `<div class="empty-state">Error: ${data.error}</div>`;
                }
            } catch (err) {
                document.getElementById('hostersGrid').innerHTML = `<div class="empty-state">Network Error: Failed to fetch hosters</div>`;
            }
        }

        function renderHosters(hosters) {
            const grid = document.getElementById('hostersGrid');
            grid.innerHTML = '';
            
            if (hosters.length === 0) {
                grid.innerHTML = `<div class="empty-state">No hosters found matching your search.</div>`;
                return;
            }
            
            hosters.forEach(h => {
                const isOnline = h.status;
                const statusClass = isOnline ? 'status-online' : 'status-offline';
                const statusText = isOnline ? 'Online' : 'Offline';
                const cardClass = isOnline ? 'online' : 'offline';
                
                const domainsHtml = (h.domains || []).slice(0, 3).map(d => `<span class="domain-tag">${d}</span>`).join('');
                const domainsExtra = h.domains.length > 3 ? `<span class="domain-tag">+${h.domains.length - 3}</span>` : '';
                
                let linkLimitText = h.daily_link_limit === 0 ? 'Unlimited' : `${h.daily_link_used} / ${h.daily_link_limit}`;
                let linkPercent = h.daily_link_limit === 0 ? 100 : (h.daily_link_used / h.daily_link_limit) * 100;
                let linkFillClass = h.daily_link_limit === 0 ? 'unlimited-fill' : '';
                if (linkPercent > 100) linkPercent = 100;
                
                let bwLimitText = h.daily_bandwidth_limit === 0 ? 'Unlimited' : `${formatBytes(h.daily_bandwidth_used)} / ${formatBytes(h.daily_bandwidth_limit)}`;
                let bwPercent = h.daily_bandwidth_limit === 0 ? 100 : (h.daily_bandwidth_used / h.daily_bandwidth_limit) * 100;
                let bwFillClass = h.daily_bandwidth_limit === 0 ? 'unlimited-fill' : '';
                if (bwPercent > 100) bwPercent = 100;

                const noteHtml = h.note ? `<div class="note-box">${h.note}</div>` : '';

                const html = `
                    <a href="${h.url}" target="_blank" class="hoster-card ${cardClass}">
                        <div class="card-header">
                            <img src="${h.icon}" alt="${h.name}" class="hoster-icon" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjOGJhMzk2IiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTEwIDEzaDJ2NEgxMHoiLz48cGF0aCBkPSJNMTAgN2gydjRMMTAgMTF6Ii8+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTAiLz48L3N2Zz4='">
                            <div class="hoster-info">
                                <div class="hoster-name">${h.name}</div>
                                <div class="status-badge ${statusClass}">
                                    <div class="status-dot"></div>
                                    ${statusText}
                                </div>
                            </div>
                        </div>
                        
                        <div class="domains-list">
                            ${domainsHtml}${domainsExtra}
                        </div>
                        
                        <div class="limit-section">
                            <div class="limit-item">
                                <div class="limit-label">
                                    <span>Daily Links</span>
                                    <span class="limit-value">${linkLimitText}</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill ${linkFillClass}" style="width: ${linkPercent}%"></div>
                                </div>
                            </div>
                            
                            <div class="limit-item">
                                <div class="limit-label">
                                    <span>Daily Bandwidth</span>
                                    <span class="limit-value">${bwLimitText}</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill ${bwFillClass}" style="width: ${bwPercent}%"></div>
                                </div>
                            </div>
                        </div>
                        
                        ${noteHtml}
                    </a>
                `;
                
                grid.insertAdjacentHTML('beforeend', html);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allHosters.filter(h => 
                h.name.toLowerCase().includes(val) || 
                (h.domains || []).some(d => d.toLowerCase().includes(val))
            );
            renderHosters(filtered);
        });

        loadHosters();
    </script>
</body>
</html>
